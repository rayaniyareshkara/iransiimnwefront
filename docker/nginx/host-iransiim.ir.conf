# Bare-metal nginx in front of two backends on one domain.
#
#   sudo cp docker/nginx/host-iransiim.ir.conf /etc/nginx/sites-available/iransiim.ir
#   sudo ln -s /etc/nginx/sites-available/iransiim.ir /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Routing:
#   /api/   -> the store backend (search, catalogue, …)   — set STORE upstream
#   /fapi/  -> the payment server in Docker (Zibal flow)
#   /       -> the SPA container, which also serves /product-image/ and /assets/
#
# The two APIs deliberately do not share a prefix. When both answered under
# /api/, whichever rule nginx matched first swallowed the other's routes and
# the loser returned 404.

upstream iransiim_store_api {
    # The existing store backend. Adjust host and port to wherever it listens.
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream iransiim_app {
    # docker-compose publishes the web container here (WEB_BIND / WEB_PORT).
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen      80;
    listen      [::]:80;
    server_name iransiim.ir www.iransiim.ir;

    charset utf-8;
    client_max_body_size 1m;

    access_log /var/log/nginx/iransiim.access.log;
    error_log  /var/log/nginx/iransiim.error.log;

    # ---- Store backend ------------------------------------------------------
    location /api/ {
        proxy_pass         http://iransiim_store_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Payment server (Docker) --------------------------------------------
    # request, verify, result and the gateway callback all live under here.
    location /fapi/ {
        proxy_pass         http://iransiim_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Returning from the gateway waits on a verify call to Zibal.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        add_header Cache-Control "no-store" always;
    }

    # ---- SPA and static assets ----------------------------------------------
    location / {
        proxy_pass         http://iransiim_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
